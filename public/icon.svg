<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="indigoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E3A5F" />
      <stop offset="100%" stop-color="#142741" />
    </linearGradient>
  </defs>
  <!-- Full-bleed Kodokan Indigo backdrop -->
  <rect width="512" height="512" fill="url(#indigoBg)" />
  <!-- Subtle archival inner frame -->
  <rect x="28" y="28" width="456" height="456" rx="36" fill="none" stroke="#FBF9F5" stroke-opacity="0.18" stroke-width="3" />
  <!-- Warm Washi circular crest (Kamon) -->
  <circle cx="256" cy="256" r="168" fill="#FBF9F5" />
  <circle cx="256" cy="256" r="154" fill="none" stroke="#1E3A5F" stroke-opacity="0.22" stroke-width="3" />
  <!-- Stylized vector calligraphy for 柔 (Ju - yielding/flexibility) -->
  <g fill="none" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top stroke & hook (矛 upper) -->
    <path d="M188 156 L320 156 L262 192" stroke-width="17" />
    <!-- Center dot / pivot -->
    <path d="M236 178 L266 198" stroke-width="15" />
    <!-- Middle horizontal with turn -->
    <path d="M174 214 L336 214 L314 242" stroke-width="17" />
    <!-- Vertical center spine -->
    <path d="M256 196 L256 266" stroke-width="17" />
    <!-- Lower horizontal (木 base) -->
    <path d="M164 296 L348 296" stroke-width="18" />
    <!-- Lower vertical spine -->
    <path d="M256 268 L256 378" stroke-width="18" />
    <!-- Left sweeping branch -->
    <path d="M254 298 C228 332 192 356 156 368" stroke-width="16" />
    <!-- Right sweeping branch -->
    <path d="M258 298 C284 332 320 356 356 368" stroke-width="16" />
  </g>
  <!-- Vermilion Hanko seal accent -->
  <rect x="336" y="330" width="46" height="46" rx="6" fill="#B91C1C" />
  <rect x="342" y="336" width="34" height="34" rx="3" fill="none" stroke="#FBF9F5" stroke-width="2" />
  <path d="M359 343 L359 363 M349 353 L369 353" stroke="#FBF9F5" stroke-width="2.5" stroke-linecap="round" />
</svg>
